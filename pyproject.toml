[project]
name = "mjlab-playground"
version = "0.1.0"
description = "Extra tasks for mjlab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab[cu128]",
    "tensorboard>=2.21",
    "torch>=2.7.0,<2.10.0",
]

[project.scripts]
rewardlab = "mjlab_playground.reward_lab:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "f7fdb163b590e980865e59a5633ff5e1143553bd" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "875c4caf06d71b12b2036c327e7a07ce08a78b9a" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 原本走 nightly 索引 (py.mujoco.org)，但旧的 dev 构建会被清掉，
# lock 里钉的 3.7.0.dev892927987 已经 404。改用 PyPI 上的正式版 3.7.0
# —— 同一条代码线的最终版，跟 mjlab / mujoco_warp 钉的 rev 对得上。
[tool.uv]
override-dependencies = ["mujoco==3.7.0"]

[tool.ruff]
indent-width = 2
src = ["src/mjlab_playground"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.13"
ignore = ["./typings"]
stubPath = "typings"
reportWildcardImportFromLibrary = false

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.entry-points."mjlab.tasks"]
mjlab_playground = "mjlab_playground"
